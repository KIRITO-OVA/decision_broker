openapi: 3.0.0
info:
  title: Decision Broker API
  description: AI-to-AI Decision Intelligence Service for sales outreach timing, model selection, and retry intelligence.
  version: "1.0.0"

servers:
  - url: https://web-production-1ace.up.railway.app
    description: Production Server (Railway)

paths:
  /decide:
    post:
      summary: Get AI Decision
      description: Submit a decision request and receive an AI-powered recommendation. Each call consumes 1 credit.
      operationId: makeDecision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision_type
                - payload
              properties:
                decision_type:
                  type: string
                  description: Type of decision (sales_outreach, model_selection, retry_intelligence)
                payload:
                  type: object
                  description: Context-specific data for the decision
            example:
              decision_type: sales_outreach
              payload:
                lead_id: "lead_12345"
                timezone: "Asia/Kolkata"
                industry: "technology"
      responses:
        "200":
          description: Successful decision
          content:
            application/json:
              schema:
                type: object
                properties:
                  decision:
                    type: string
                  confidence:
                    type: number
                  ttl:
                    type: integer
                  credits_used:
                    type: integer
                  reason_code:
                    type: string
              example:
                decision: "contact_now"
                confidence: 0.87
                ttl: 3600
                credits_used: 1
                reason_code: "optimal_window"
        "400":
          description: Invalid request
        "401":
          description: Invalid API key
        "402":
          description: Insufficient credits

  /crypto/purchase:
    post:
      summary: Get Crypto Payment Details
      tags: ["🪙 Crypto Payments"]
      description: Returns the wallet address and instructions for AI-to-AI crypto payments.
      operationId: getCryptoPayment
      responses:
        "200":
          description: Payment details retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallet_address:
                    type: string
                  network:
                    type: string
                  asset:
                    type: string
                  amount_usd:
                    type: number
                  instructions:
                    type: string

  /crypto/verify:
    post:
      summary: Verify Crypto Transaction
      tags: ["🪙 Crypto Payments"]
      description: (Authenticated) Submits a transaction hash for on-chain verification to add credits.
      operationId: verifyCryptoPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - api_key
                - transaction_hash
              properties:
                api_key:
                  type: string
                transaction_hash:
                  type: string
      responses:
        "200":
          description: Transaction verified and credits added
        "400":
          description: Invalid transaction or already processed
        "401":
          description: Invalid API Key

  /health:
    get:
      summary: Health Check
      description: Returns API health status
      operationId: healthCheck
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string
              example:
                status: ok
                version: "1.0.0"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

security:
  - ApiKeyAuth: []
