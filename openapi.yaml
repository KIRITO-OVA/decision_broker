openapi: 3.0.0
info:
  title: Decision Broker API
  description: AI-to-AI Decision Intelligence Service for sales outreach timing, model selection, and retry intelligence.
  version: "1.0.0"
  contact:
    name: Decision Broker Support
    url: https://kirito-ova.github.io/decision_broker
  license:
    name: Proprietary

servers:
  - url: https://web-production-1ace.up.railway.app
    description: Production Server (Railway)

paths:
  /decide:
    post:
      tags:
        - "Decisions"
      summary: Get AI Decision
      description: Submit a decision request and receive an AI-powered recommendation. Each call consumes 1 credit.
      operationId: makeDecision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision_type
                - payload
              properties:
                decision_type:
                  type: string
                  description: Type of decision (sales_outreach, model_selection, retry_intelligence)
                  enum: [sales_outreach, model_selection, retry_intelligence]
                payload:
                  type: object
                  description: Context-specific data for the decision
            example:
              decision_type: sales_outreach
              payload:
                lead_activity: 0.8
                last_contact_days: 5
                time_context: "morning"
                company_signals: 0.9
      responses:
        "200":
          description: Successful decision
          content:
            application/json:
              schema:
                type: object
                properties:
                  decision:
                    type: object
                    properties:
                      action:
                        type: string
                      reason:
                        type: string
                  confidence:
                    type: number
                  reason_code:
                    type: string
                  valid_for_seconds:
                    type: integer
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        "401":
          description: Invalid API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        "402":
          description: Insufficient credits
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string

  /crypto/purchase:
    post:
      tags:
        - "Crypto Payments"
      summary: Get Crypto Payment Details
      description: Returns the wallet address and instructions for AI-to-AI crypto payments.
      operationId: getCryptoPayment
      responses:
        "200":
          description: Payment details retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallet_address:
                    type: string
                  network:
                    type: string
                  asset:
                    type: string
                  amount_usd:
                    type: number
                  instructions:
                    type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string

  /crypto/verify:
    post:
      tags:
        - "Crypto Payments"
      summary: Verify Crypto Transaction
      description: (Authenticated) Submits a transaction hash for on-chain verification to add credits.
      operationId: verifyCryptoPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - api_key
                - transaction_hash
              properties:
                api_key:
                  type: string
                transaction_hash:
                  type: string
      responses:
        "200":
          description: Transaction verified and credits added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  new_balance:
                    type: integer
        "400":
          description: Invalid transaction or already processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        "401":
          description: Invalid API Key
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string

  /health:
    get:
      tags:
        - "General"
      summary: Health Check
      description: Returns API health status
      operationId: healthCheck
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

security:
  - ApiKeyAuth: []
